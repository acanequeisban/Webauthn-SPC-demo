<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SPC Demo</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <nav class="nav">
        <div class="container">
            <div class="nav-container">
                <a href="/" class="nav-brand">
                    <svg class="passkey-icon" viewBox="0 0 24 24">
                        <path d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                    </svg>
                    SPC Demo
                </a>
                <div class="nav-links">
                    <a href="/" class="nav-link">Inicio</a>
                    <a href="/register.html" class="nav-link">Registro</a>
                    <a href="/login.html" class="nav-link">Login</a>
                    <a href="/passkey.html" class="nav-link">Passkeys</a>
                    <a href="/payment.html" class="nav-link">Pagos</a>
                </div>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <h1>Iniciar sesión</h1>
                <p>Accede con tu cuenta o passkey</p>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Nombre de usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        required 
                        autocomplete="username webauthn"
                        placeholder="johndoe"
                    >
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        required 
                        autocomplete="current-password"
                        placeholder="••••••••"
                    >
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Iniciar sesión
                </button>
            </form>

            <div class="divider"></div>

            <button type="button" id="authenticate-passkey" class="btn btn-secondary btn-block">
                <svg class="passkey-icon" viewBox="0 0 24 24" style="width: 20px; height: 20px;">
                    <path fill="currentColor" d="M12.65 10A5.99 5.99 0 0 0 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6a5.99 5.99 0 0 0 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/>
                </svg>
                Iniciar sesión con passkey
            </button>

            <div class="divider"></div>

            <p class="text-center text-muted">
                ¿No tienes cuenta? 
                <a href="/register.html" style="color: var(--primary-color); text-decoration: none;">
                    Regístrate
                </a>
            </p>
        </div>

        <div class="card">
            <div class="alert alert-info">
                <svg viewBox="0 0 24 24" style="width: 24px; height: 24px;">
                    <path fill="currentColor" d="M13,9H11V7H13M13,17H11V11H13M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2Z"/>
                </svg>
                <div>
                    <strong>Tip:</strong> Si tienes una passkey registrada, puedes seleccionarla 
                    desde el menú desplegable del campo de usuario para un acceso más rápido.
                </div>
            </div>
        </div>
    </div>

    <script src="/js/utils.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
